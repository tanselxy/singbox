name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Pinned upstream sing-box version we build (with the with_v2ray_api tag, which
# the official binaries omit). Bump this to track upstream.
env:
  SINGBOX_VERSION: "1.13.14"
  SINGBOX_TAGS: "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_v2ray_api"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Build panel binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags "${LDFLAGS}" \
              -o "dist/singbox-panel_linux_${arch}" ./cmd/singbox-panel
          done

      - name: Build sing-box with v2ray_api
        # We redistribute a build of upstream sing-box (GPL-3.0). It is built
        # unmodified from the tag below; corresponding source is at
        # https://github.com/SagerNet/sing-box/tree/v${SINGBOX_VERSION}
        run: |
          git clone --depth 1 --branch "v${SINGBOX_VERSION}" \
            https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -tags "${SINGBOX_TAGS}" \
              -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}" \
              -o "${GITHUB_WORKSPACE}/dist/sing-box_linux_${arch}" ./cmd/sing-box
          done

      - name: Checksums
        run: |
          cd dist
          sha256sum singbox-panel_linux_* sing-box_linux_* > checksums.txt
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
