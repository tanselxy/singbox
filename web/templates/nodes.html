<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>节点 · Sing-Box 面板</title>
  <link rel="stylesheet" href="{{.Prefix}}/static/style.css">
</head>
<body data-prefix="{{.Prefix}}">
  <header class="topbar">
    <strong>Sing-Box 面板</strong>
    <nav>
      <a href="{{.Prefix}}/dashboard">控制台</a>
      <a href="{{.Prefix}}/nodes">节点</a>
      <a href="{{.Prefix}}/tools">节点转换</a>
      <form method="post" action="{{.Prefix}}/logout" class="inline">
        <button type="submit" class="link">退出</button>
      </form>
    </nav>
  </header>

  <main>
    <section class="card">
      <h3>本机接入信息</h3>
      <p class="muted small">把这台机器加到其它「主控」面板时，用下面的地址和令牌。{{if .Managed}}<b class="alert">本机已被某主控接管。</b>{{end}}</p>
      <label>Agent 地址
        <span class="field"><input class="mono" readonly value="{{.SelfAgentURL}}"><button class="copy" data-url="{{.SelfAgentURL}}">复制</button></span>
      </label>
      <label>Agent 令牌
        <span class="field"><input class="mono" readonly value="{{.SelfToken}}"><button class="copy" data-url="{{.SelfToken}}">复制</button></span>
      </label>
    </section>

    <section class="card">
      <div class="node-head">
        <h3>受控节点</h3>
        <button id="add-node">+ 添加节点</button>
      </div>
      <div id="node-form" class="add-form" hidden>
        <input id="node-name" type="text" placeholder="节点名（唯一）">
        <input id="node-address" type="text" placeholder="Agent 地址 https://ip:端口">
        <input id="node-token" type="text" placeholder="Agent 令牌">
        <button id="create-node">确认添加</button>
        <button id="cancel-node" class="link">取消</button>
      </div>
      <p class="muted small">添加后，主控会把当前客户下发到该节点，订阅将自动包含该节点的所有协议。</p>
      <table class="clients">
        <thead>
          <tr><th>名称</th><th>地址</th><th>状态</th><th>CPU</th><th>内存</th><th>磁盘</th><th>操作</th></tr>
        </thead>
        <tbody>
          {{range .Nodes}}
          <tr data-id="{{.ID}}">
            <td>{{.Name}}</td>
            <td class="mono small">{{.Address}}</td>
            <td><span class="badge {{if .Online}}ok{{else}}down{{end}}">{{if .Online}}在线{{else}}离线{{end}}</span></td>
            <td>{{.CPU}}</td>
            <td class="small">{{.Mem}}</td>
            <td class="small">{{.Disk}}</td>
            <td class="row-actions">
              <button data-node-action="delete" data-id="{{.ID}}" class="warn">删除</button>
            </td>
          </tr>
          {{else}}
          <tr><td colspan="7" class="muted">还没有受控节点。</td></tr>
          {{end}}
        </tbody>
      </table>
    </section>
  </main>

  <script src="{{.Prefix}}/static/app.js"></script>
</body>
</html>
