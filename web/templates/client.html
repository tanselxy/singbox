<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Client.Name}} · Sing-Box 面板</title>
  <link rel="stylesheet" href="{{.Prefix}}/static/dashboard.css">
</head>
<body data-prefix="{{.Prefix}}" class="min-h-screen bg-background text-foreground antialiased">
  <header class="sticky top-0 z-20 flex h-14 items-center justify-between border-b bg-background/80 px-4 backdrop-blur md:px-6">
    <strong class="text-sm font-semibold tracking-tight">Sing-Box 面板</strong>
    <nav class="flex items-center gap-4 text-sm">
      <a class="text-muted-foreground transition-colors hover:text-foreground" href="{{.Prefix}}/dashboard">← 返回控制台</a>
      <a class="text-muted-foreground transition-colors hover:text-foreground" href="{{.Prefix}}/tools">节点转换</a>
      <form method="post" action="{{.Prefix}}/logout">
        <button type="submit" class="text-muted-foreground transition-colors hover:text-foreground cursor-pointer">退出</button>
      </form>
    </nav>
  </header>

  <main class="mx-auto w-full max-w-5xl space-y-6 p-4 md:p-6">
    <section class="rounded-xl border bg-card p-6 shadow-sm">
      <div class="flex flex-wrap gap-x-10 gap-y-4">
        <div><div class="text-sm text-muted-foreground">客户</div><div class="mt-1 font-mono">{{.Client.Name}}</div></div>
        <div><div class="text-sm text-muted-foreground">已用流量</div><div class="mt-1">{{.Used}}</div></div>
        <div><div class="text-sm text-muted-foreground">配额</div><div class="mt-1">{{.Quota}}</div></div>
        <div><div class="text-sm text-muted-foreground">设备数</div><div class="mt-1">{{.Devices}}</div></div>
        <div><div class="text-sm text-muted-foreground">到期</div><div class="mt-1">{{.Expiry}}</div></div>
      </div>
      <div class="mt-6 flex items-center justify-between">
        <h3 class="text-base font-semibold">订阅链接</h3>
        <button class="copy inline-flex h-8 items-center rounded-md border px-3 text-sm hover:bg-accent cursor-pointer" data-url="{{.SubURL}}">复制</button>
      </div>
      <textarea class="mt-2 w-full rounded-md border bg-transparent px-3 py-2 font-mono text-xs" readonly rows="2">{{.SubURL}}</textarea>
      <p class="mt-2 text-sm text-muted-foreground">导入到 v2rayN / Shadowrocket / sing-box 等客户端。追加 <span class="font-mono">?target=raw</span> 可得明文链接列表。</p>

      <div class="mt-5 flex items-center justify-between">
        <h3 class="text-base font-semibold">Clash Verge 链接</h3>
        <button class="copy inline-flex h-8 items-center rounded-md border px-3 text-sm hover:bg-accent cursor-pointer" data-url="{{.ClashSubURL}}">复制</button>
      </div>
      <textarea class="mt-2 w-full rounded-md border bg-transparent px-3 py-2 font-mono text-xs" readonly rows="2">{{.ClashSubURL}}</textarea>
    </section>

    <section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      {{range .Nodes}}
      <div class="rounded-xl border bg-card p-4 shadow-sm">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-semibold">{{.Name}}</h3>
          <button class="copy inline-flex h-7 items-center rounded-md border px-2.5 text-xs hover:bg-accent cursor-pointer" data-url="{{.URL}}">复制</button>
        </div>
        <img class="mx-auto my-3 size-40 rounded-lg bg-white p-2" src="{{.QRPath}}" alt="{{.Name}} 二维码" loading="lazy">
        <textarea class="w-full rounded-md border bg-transparent px-3 py-2 font-mono text-xs" readonly rows="3">{{.URL}}</textarea>
      </div>
      {{else}}
      <p class="text-sm text-muted-foreground">没有可展示的节点。</p>
      {{end}}
    </section>
  </main>

  <script src="{{.Prefix}}/static/app.js"></script>
</body>
</html>
