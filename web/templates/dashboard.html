<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sing-Box 面板</title>
  <link rel="stylesheet" href="{{.Prefix}}/static/style.css">
</head>
<body data-prefix="{{.Prefix}}">
  <header class="topbar">
    <strong>Sing-Box 面板</strong>
    <nav>
      <form method="post" action="{{.Prefix}}/logout" class="inline">
        <button type="submit" class="link">退出</button>
      </form>
    </nav>
  </header>

  <div id="dashboard-root" class="dashboard-root" data-prefix="{{.Prefix}}" data-view="{{.View}}">
    <section class="card">
      <h1>面板加载中</h1>
      <p class="muted">正在加载总览数据。</p>
      <noscript>
        <p class="alert">浏览器需要启用 JavaScript 才能使用面板。</p>
      </noscript>
      <div class="sr-fallback">
        {{range .Clients}}{{.Name}} {{end}}
      </div>
    </section>
  </div>

  <script src="{{.Prefix}}/static/dashboard-react.js"></script>
</body>
</html>
