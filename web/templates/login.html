<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Sing-Box 面板</title>
  <link rel="stylesheet" href="{{.Prefix}}/static/style.css">
</head>
<body class="center">
  <form class="card login" method="post" action="{{.Prefix}}/login">
    <h1>Sing-Box 面板</h1>
    {{if eq .Error "invalid"}}<p class="alert">密码错误</p>{{end}}
    {{if eq .Error "locked"}}<p class="alert">尝试过于频繁，请稍后再试</p>{{end}}
    <label>密码
      <input type="password" name="password" autofocus autocomplete="current-password" required>
    </label>
    <button type="submit">登录</button>
  </form>
</body>
</html>
